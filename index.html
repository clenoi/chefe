<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chefe 🧠</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0f1115;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;padding:0}
.top{background:linear-gradient(135deg,#7c3aed,#ec4899);padding:18px 16px 22px;text-align:center;border-radius:0 0 24px 24px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.top h1{margin:0;font-size:22px}
.top p{margin:6px 0 0;opacity:.9;font-size:13px}
.main{max-width:720px;margin:14px auto;padding:0 12px 20px}
.card{background:#1c1f27;border:1px solid #2a2e3a;padding:14px;border-radius:18px;margin:12px 0}
.card b{font-size:14px}
input,select{width:100%;padding:13px 12px;border-radius:12px;border:1px solid #2a2e3a;background:#11141b;color:#fff;margin-top:8px;outline:none;font-size:14px}
input:focus{border-color:#7c3aed}
.btn{background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;border:none;padding:13px;border-radius:12px;font-weight:800;cursor:pointer;width:100%;margin-top:8px;font-size:14px}
#chat{height:340px;overflow-y:auto;background:#11141b;border:1px solid #2a2e3a;padding:12px;border-radius:18px;margin:12px 0}
.msg{background:#232733;padding:11px 13px;border-radius:16px 16px 16px 4px;margin:8px 0;font-size:14px;line-height:1.5;max-width:90%}
.me{background:#7c3aed;margin-left:auto;border-radius:16px 16px 4px 16px;text-align:left}
.iaMsg{background:#1e2a3a}
.modMsg{background:#2a2113;border:1px solid #f59e0b}
.row{display:flex;gap:8px}
.row input{flex:1}
.row .btn{width:auto;padding:13px 18px}
.small{font-size:12px;opacity:.75}
.pill{display:inline-block;background:#ffffff22;padding:4px 10px;border-radius:99px;font-size:11px;margin-top:6px}
</style>
</head>
<body>
<div class="top">
<h1>Chefe 🧠☁️</h1>
<p>Multi Servidor, 1 Cérebro! • Feita em Caxias do Sul</p>
<span class="pill">🟢 ONLINE</span> <span class="pill">💬 CHAT</span> <span class="pill">📚 MEMÓRIA</span>
</div>
<div class="main">
<div class="card">
<b>🧠 CÉREBRO (Supabase)</b>
<input id="supaUrl" placeholder="Supabase URL - ex: https://xyz.supabase.co">
<input id="supaKey" placeholder="Supabase Key (anon public)">
<button class="btn" onclick="conectarCerebro()">Conectar Cérebro</button>
<div id="statusCerebro" class="small" style="margin-top:8px">Sem cérebro ainda, usando memória local.</div>
</div>
<div class="card">
<b>🔌 CORPOS (Servidores Ollama)</b>
<input id="srv1" placeholder="Servidor 1" value="http://localhost:11434">
<input id="srv2" placeholder="Servidor 2 - ex: https://teu-render.onrender.com">
<input id="srv3" placeholder="Servidor 3">
<select id="modelo"><option value="llama3.2">llama3.2</option><option value="llama3">llama3</option><option value="mistral">mistral</option><option value="phi3">phi3</option></select>
<button class="btn" onclick="testarTodos()">Testar todos os servidores</button>
<div id="statusSrv" class="small" style="margin-top:8px"></div>
</div>
<div class="card"><b>📚 MEMÓRIA</b><div id="memoria" style="font-size:12px;margin-top:8px">Nada ainda</div></div>
<div id="chat"></div>
<div class="row"><input id="inp" placeholder="Fala com ela..."><button class="btn" onclick="enviar(document.getElementById('inp').value)">Enviar</button></div>
<p class="small" style="text-align:center;margin-top:12px">Comandos: <b>me ensina que...</b> | <b>mostra meu banco</b> | <b>sincronizar</b></p>
</div>
<script>
var memoria = JSON.parse(localStorage.getItem('chefe_multi_memoria')||'[]');
var base = [
 {tema:'python', fato:'Python: print("Oi") mostra Oi. Fácil, pra IA, sites, automação.'},
 {tema:'programação', fato:'Programação é dar ordens passo a passo, como receita de bolo. Começa com Python!'},
 {tema:'servidor gratis', fato:'Sem cartão: Hugging Face, Render, Vercel, Netlify, Glitch, Replit, Supabase, Google Colab. Com cartão: Oracle, Fly.io, Railway.'},
 {tema:'multi servidor', fato:'Multi servidor = vários corpos, 1 cérebro. Cérebro no Supabase, corpos no Render/Vercel/Hugging Face. Se 1 cair, outro assume!'}
];
function addChat(q,t,c){var d=document.getElementById('chat'); d.innerHTML += '<div class="msg '+(c||'')+'"><b>'+q+':</b> '+t+'</div>'; d.scrollTop=99999;}
function salvar(){localStorage.setItem('chefe_multi_memoria',JSON.stringify(memoria)); renderMem(); sincronizarCerebro();}
function renderMem(){var a=document.getElementById('memoria'); a.innerHTML = memoria.length? memoria.slice(-5).reverse().map(x=>'<div style="background:#11141b;padding:8px;border-radius:12px;margin:5px 0;font-size:12px">📌 <b>'+x.tema+'</b>: '+x.fato.slice(0,60)+'...<br><small>'+x.ia+'</small></div>').join('') : 'Nada ainda';}
function falar(t){try{var s=new SpeechSynthesisUtterance(t.replace(/[^a-zA-Z0-9áàâãéêíóôõúç .,!?]/gi,'').slice(0,250)); s.lang='pt-BR'; window.speechSynthesis.speak(s);}catch(e){}}
function getServidores(){ return [document.getElementById('srv1').value.trim(), document.getElementById('srv2').value.trim(), document.getElementById('srv3').value.trim()].filter(s=>s); }
async function conectarCerebro(){
  var url=document.getElementById('supaUrl').value.trim(); var key=document.getElementById('supaKey').value.trim();
  if(!url||!key){ document.getElementById('statusCerebro').innerHTML='Cola URL e Key do Supabase! Sem isso, usa memória local.'; return; }
  localStorage.setItem('chefe_supa_url',url); localStorage.setItem('chefe_supa_key',key);
  document.getElementById('statusCerebro').innerHTML='🟢 <b>Cérebro conectado!</b> '+url;
  addChat('Chefe 🧠','🟢 <b>Cérebro conectado!</b> Agora todos os servidores leem a mesma memória!', 'modMsg');
  sincronizarCerebro();
}
async function sincronizarCerebro(){
  var url=localStorage.getItem('chefe_supa_url'); var key=localStorage.getItem('chefe_supa_key');
  if(!url||!key) return;
  try{ for(var i=0;i<memoria.length;i++){ var m=memoria[i]; await fetch(url+'/rest/v1/memoria',{method:'POST',headers:{'apikey':key,'Authorization':'Bearer '+key,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},body:JSON.stringify({tema:m.tema,fato:m.fato,ia:m.ia})}); } }catch(e){}
}
async function testarTodos(){
  var srvs=getServidores(); var res='';
  for(var i=0;i<srvs.length;i++){ try{ var r=await fetch(srvs[i]+'/api/tags'); var j=await r.json(); res+='🟢 Servidor '+(i+1)+': LIGADO - '+j.models.length+' IAs<br>'; }catch(e){ res+='🔴 Servidor '+(i+1)+': Desligado / Sem Ollama<br>'; } }
  document.getElementById('statusSrv').innerHTML=res;
}
async function perguntarMulti(pergunta){
  var modelo=document.getElementById('modelo').value; var q=pergunta.toLowerCase(); var srvs=getServidores();
  var achado=memoria.filter(f=>{var txt=(f.tema+' '+f.fato).toLowerCase(); return q.split(' ').filter(w=>w.length>2).some(p=>txt.indexOf(p)!==-1);});
  if(achado.length>0 && (q.indexOf('qual')!==-1||q.indexOf('nome')!==-1)){ addChat('Chefe 🧠','Achei no cérebro! Tu me ensinou: <b>'+achado[0].fato+'</b>', 'iaMsg'); falar(achado[0].fato); return; }
  var achadoBase=base.filter(f=>q.indexOf(f.tema.split(' ')[0])!==-1);
  if(achadoBase.length>0 && q.length<60){ addChat('Chefe 📚',achadoBase[0].fato, 'iaMsg'); return; }
  for(var i=0;i<srvs.length;i++){
    try{
      addChat('Chefe 🔌','Tentando Corpo '+(i+1)+' com '+modelo+'...', 'iaMsg');
      var resp=await fetch(srvs[i]+'/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:modelo,prompt:'Você é a Chefe, IA brasileira, fala natural, tchê, bah, né, como amiga de Caxias do Sul. Curta, natural. Pergunta: '+pergunta, stream:false})});
      var j=await resp.json(); var resposta=j.response||'Sem resposta';
      memoria.push({tema:pergunta.slice(0,40), fato:resposta.slice(0,300), ia: modelo+' via Servidor '+(i+1)}); salvar();
      addChat('Chefe 🤖',resposta+'<br><br><small>Via '+srvs[i]+' | Salvo no Cérebro!</small>', 'iaMsg'); falar(resposta); return;
    }catch(e){}
  }
  addChat('Chefe 🔴','Todos os servidores falharam! Liga teu PC: CMD > <b>set OLLAMA_ORIGINS=*</b> + <b>ollama serve</b>', 'iaMsg');
}
addChat('Chefe','Oii! Agora eu sou <b>Multi-Servidor, 1 Cérebro</b>! 🧠☁️<br><br>1. Cria conta no <b>supabase.com</b> > Copia URL e Key > Cola ali em cima > <b>Conectar Cérebro</b><br>2. Clica <b>Testar todos os servidores</b><br>3. Ensina Thor aqui, ela lembra no celular também!', 'modMsg');
renderMem();
document.getElementById('supaUrl').value=localStorage.getItem('chefe_supa_url')||'';
document.getElementById('supaKey').value=localStorage.getItem('chefe_supa_key')||'';
function enviar(t){ t=(t||'').trim(); if(!t) return; addChat('Tu',t,'me'); document.getElementById('inp').value=''; var x=t.toLowerCase();
 if(x.indexOf('sincronizar')!==-1){ sincronizarCerebro(); addChat('Chefe 🔄','Sincronizei! Memória local -> Cérebro (Supabase)!', 'modMsg'); return; }
 if(x.indexOf('mostra meu banco')!==-1){ var s='<b>📚 CÉREBRO ÚNICO:</b><br>Base: '+base.map(f=>'• '+f.tema+': '+f.fato.slice(0,60)+'<br>').join('')+'<br>Memória ('+memoria.length+'): '+memoria.map(f=>'• <b>'+f.tema+'</b>: '+f.fato.slice(0,60)+' via '+f.ia+'<br>').join(''); addChat('Chefe 📚',s,'modMsg'); return; }
 if(x.indexOf('me ensina que')!==-1){ var fato=t.replace(/me ensina que/gi,'').trim(); var tema=fato.indexOf('cachorro')!==-1?'cachorro':fato.split(' ').slice(0,3).join(' '); memoria.push({tema,fato,ia:'Ensinado por ti'}); salvar(); addChat('Chefe 🎓','✅ <b>APRENDI!</b> '+fato, 'modMsg'); return; }
 perguntarMulti(t);
}
document.getElementById('inp').addEventListener('keydown',function(e){if(e.key==='Enter') enviar(e.target.value);});
</script>
</body>
</html>
